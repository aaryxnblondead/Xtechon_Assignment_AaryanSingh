version: '3.8'
services:
  mongo:
    image: mongo:6
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
  backend:
    build: ./backend
    environment:
      - MONGODB_URI=mongodb://mongo:27017/flight-booking
      - JWT_SECRET=your-secret-key-change-in-production
      - JWT_EXPIRE=7d
      - PORT=5000
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongo
    ports:
      - '5000:5000'
  frontend:
    image: node:18
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
volumes:
  mongo_data:
